<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mapa do Brasil — HUD Animado</title>
<style>
  :root{
    --bg-0:#eef5fc;
    --bg-1:#cfe1f5;
    --bg-2:#a8c4e8;
    --grid-line: rgba(90,140,210,0.10);
    --grid-line-strong: rgba(110,160,220,0.18);
    --map-stroke: rgba(60,95,150,0.55);
    --map-stroke-soft: rgba(60,95,150,0.3);
    --map-fill-a: rgba(96,140,205,0.85);
    --map-fill-b: rgba(120,158,215,0.55);
    --dot-color:#ffffff;
    --dot-glow:#eaf3ff;
    --accent:#ffffff;
    --ring-color: rgba(70,110,175,0.55);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: transparent;
    overflow:hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  .scene{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    perspective: 1400px;
    perspective-origin: 50% 30%;
  }
  .floor{
    display:none;
  }
  .rings{
    position:absolute;
    left:50%; top:50%;
    width:640px; height:640px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    opacity:0;
    animation: ringsIn 2s ease-out .2s forwards;
  }
  .rings .ring{
    position:absolute; left:50%; top:50%;
    border-radius:50%;
    border:1px solid var(--ring-color);
    transform:translate(-50%,-50%);
    opacity:.5;
  }
  .rings .ring.r1{ width:200px; height:200px; opacity:.6; }
  .rings .ring.r2{ width:360px; height:360px; opacity:.42; }
  .rings .ring.r3{ width:520px; height:520px; opacity:.28; }
  .rings .sweep{
    position:absolute; left:50%; top:50%;
    width:520px; height:520px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background: conic-gradient(from 0deg, rgba(70,110,175,0.4), rgba(70,110,175,0) 28%);
    animation: sweep 6s linear infinite;
  }
  @keyframes sweep{ from{ transform:translate(-50%,-50%) rotate(0deg);} to{ transform:translate(-50%,-50%) rotate(360deg);} }
  @keyframes ringsIn{ from{ opacity:0; } to{ opacity:1; } }
  .haze{
    position:absolute; left:0; top:0; width:100%; height:100%;
    background: radial-gradient(ellipse 55% 42% at 46% 48%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 70%);
    pointer-events:none;
  }
  .particles{
    position:absolute; inset:0; pointer-events:none;
  }
  .particles span{
    position:absolute;
    width:2px; height:2px;
    background: rgba(255,255,255,0.75);
    border-radius:50%;
    animation: drift linear infinite;
  }
  @keyframes drift{
    from{ transform:translateY(0); opacity:0; }
    10%{ opacity:.8; }
    90%{ opacity:.5; }
    to{ transform:translateY(-140px); opacity:0; }
  }
  .map-holder{
    position:relative;
    width:min(78vw, 900px);
    aspect-ratio: 1 / 1;
    transform: rotateX(18deg);
    transform-style:preserve-3d;
    filter: drop-shadow(0 30px 45px rgba(40,70,120,0.25));
  }
  svg.mapa{ width:100%; height:100%; overflow:visible; }

  .estado-fill{
    fill:url(#fillGrad);
    opacity:0;
    animation: fillIn 1.2s ease-out forwards;
  }
  .estado-stroke{
    fill:none;
    stroke: var(--map-stroke);
    stroke-width:1;
    stroke-linejoin:round;
    stroke-linecap:round;
    opacity:0;
    animation: drawIn 1.05s cubic-bezier(.4,.7,.3,1) forwards;
  }
  @keyframes drawIn{
    0%{ opacity:0; stroke-dashoffset: var(--len); }
    3%{ opacity:1; }
    100%{ opacity:1; stroke-dashoffset:0; }
  }
  @keyframes fillIn{
    0%{ opacity:0; }
    100%{ opacity:1; }
  }

  .netline{
    fill:none;
    stroke: rgba(255,255,255,0.55);
    stroke-width:0.8;
    opacity:0;
    animation: netIn 1s ease-out forwards, netPulse 5s ease-in-out infinite;
  }
  @keyframes netIn{
    0%{ opacity:0; stroke-dashoffset: var(--nlen); }
    100%{ opacity:1; stroke-dashoffset:0; }
  }
  @keyframes netPulse{
    0%,100%{ opacity:.35; }
    50%{ opacity:.75; }
  }

  .dot{
    fill: var(--dot-color);
    filter: url(#dotGlow);
    opacity:0;
    transform-origin:center;
    animation: dotIn .5s ease-out forwards, dotPulse 3.2s ease-in-out infinite;
  }
  .dot.hub{
    fill:#ffffff;
  }
  @keyframes dotIn{
    0%{ opacity:0; r:0; }
    100%{ opacity:1; }
  }
  @keyframes dotPulse{
    0%,100%{ opacity:.55; }
    50%{ opacity:1; }
  }

  .label{
    position:absolute;
    left:50%; bottom:6%;
    transform:translateX(-50%);
    text-align:center;
    opacity:0;
    animation: labelIn 1s ease-out 2.4s forwards;
  }
  .label .titulo{
    font-size: clamp(22px, 3vw, 34px);
    letter-spacing: 0.5em;
    color: #eaf5ff;
    font-weight:300;
    text-shadow: 0 0 18px rgba(120,190,255,0.8);
  }
  .label .sub{
    margin-top:6px;
    font-size: 11px;
    letter-spacing:0.35em;
    color: rgba(150,200,255,0.65);
  }
  @keyframes labelIn{
    from{ opacity:0; transform:translateX(-50%) translateY(10px); }
    to{ opacity:1; transform:translateX(-50%) translateY(0); }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="rings">
    <div class="sweep"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
  </div>
  <div class="haze"></div>
  <div class="particles" id="particles"></div>

  <div class="map-holder">
    <svg class="mapa" viewBox="0 0 1000 1000">
      <defs>
        <radialGradient id="fillGrad" cx="40%" cy="30%" r="80%">
          <stop offset="0%" stop-color="rgba(150,190,235,0.9)"/>
          <stop offset="55%" stop-color="var(--map-fill-a)"/>
          <stop offset="100%" stop-color="var(--map-fill-b)"/>
        </radialGradient>
        <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
          <feGaussianBlur stdDeviation="1.8" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <g id="fills"></g>
      <g id="strokes"></g>
      <g id="lines"></g>
      <g id="dots"></g>
    </svg>
  </div>
</div>

const fillsG = document.getElementById('fills');
const strokesG = document.getElementById('strokes');
const linesG = document.getElementById('lines');
const dotsG = document.getElementById('dots');

// single solid fill for the whole country (no interior holes)
const fillPath = document.createElementNS('http://www.w3.org/2000/svg','path');
fillPath.setAttribute('d', FILL_D);
fillPath.setAttribute('class','estado-fill');
fillPath.setAttribute('fill-rule','nonzero');
fillPath.style.animationDelay = '0.35s';
fillsG.appendChild(fillPath);

STATES.forEach(s => {
  const strokePath = document.createElementNS('http://www.w3.org/2000/svg','path');
  strokePath.setAttribute('d', s.d);
  strokePath.setAttribute('class','estado-stroke');
  strokesG.appendChild(strokePath);
  // measure after appended (needs to be in DOM)
  requestAnimationFrame(() => {
    const total = strokePath.getTotalLength();
    strokePath.style.setProperty('--len', total);
    strokePath.style.strokeDasharray = total;
    strokePath.style.animationDelay = s.delay + 's, ' + (s.delay + 4) + 's';
  });
});

const totalDrawTime = STATES.length ? (STATES[STATES.length-1].delay + 1.1) : 1;

// pick a spread-out subset of dots as "hub" nodes for the constellation network
const shuffled = DOTS.map((p,i)=>({p,i})).sort(()=>Math.random()-0.5);
const hubCount = Math.min(26, Math.floor(DOTS.length*0.07));
const hubs = [];
for (const item of shuffled){
  if (hubs.length >= hubCount) break;
  const tooClose = hubs.some(h => Math.hypot(h.p[0]-item.p[0], h.p[1]-item.p[1]) < 70);
  if (!tooClose) hubs.push(item);
}
const hubIdx = new Set(hubs.map(h=>h.i));

// connect each hub to its 2 nearest hub neighbors
const edges = new Set();
hubs.forEach(h => {
  const dists = hubs
    .filter(o => o.i !== h.i)
    .map(o => ({o, d: Math.hypot(h.p[0]-o.p[0], h.p[1]-o.p[1])}))
    .sort((a,b)=>a.d-b.d)
    .slice(0,2);
  dists.forEach(({o}) => {
    const key = [h.i,o.i].sort((a,b)=>a-b).join('-');
    edges.add(key);
  });
});

let edgeDelay = totalDrawTime * 0.55;
edges.forEach(key => {
  const [a,b] = key.split('-').map(Number);
  const p1 = DOTS[a], p2 = DOTS[b];
  const line = document.createElementNS('http://www.w3.org/2000/svg','path');
  line.setAttribute('d', `M${p1[0]},${p1[1]} L${p2[0]},${p2[1]}`);
  line.setAttribute('class','netline');
  linesG.appendChild(line);
  requestAnimationFrame(() => {
    const len = line.getTotalLength();
    line.style.setProperty('--nlen', len);
    line.style.strokeDasharray = len;
    edgeDelay += 0.06;
    line.style.animationDelay = edgeDelay.toFixed(2) + 's, ' + (Math.random()*4).toFixed(2) + 's';
  });
});

DOTS.forEach((p, i) => {
  const isHub = hubIdx.has(i);
  const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx', p[0]);
  c.setAttribute('cy', p[1]);
  c.setAttribute('r', isHub ? (2.6 + Math.random()*1.2).toFixed(2) : (1.0 + Math.random()*1.0).toFixed(2));
  c.setAttribute('class', isHub ? 'dot hub' : 'dot');
  const dotDelay = isHub
    ? totalDrawTime * 0.4 + Math.random() * (totalDrawTime * 0.3)
    : totalDrawTime * 0.35 + Math.random() * (totalDrawTime * 0.9);
  const pulseDelay = Math.random() * 3;
  c.style.animationDelay = dotDelay.toFixed(2) + 's, ' + pulseDelay.toFixed(2) + 's';
  dotsG.appendChild(c);
});

// floating ambient particles on the floor haze
const pWrap = document.getElementById('particles');
for(let i=0;i<28;i++){
  const s = document.createElement('span');
  s.style.left = (Math.random()*100) + '%';
  s.style.top = (20 + Math.random()*60) + '%';
  s.style.animationDuration = (6 + Math.random()*8) + 's';
  s.style.animationDelay = (Math.random()*8) + 's';
  pWrap.appendChild(s);
}
