    <text x="25" y="14" font-size="10" fill="#2d7a9e" font-weight="500" style="fill:rgb(45, 122, 158);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:10px;font-weight:500;text-anchor:start;dominant-baseline:auto">Ativa</text>
    
