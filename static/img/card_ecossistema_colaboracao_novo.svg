  <line x1="66" y1="86" x2="74" y2="56" stroke="#2d7a9e" stroke-width="1" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(45, 122, 158);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
