<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    RADAR BRASIL - LOGO SÍMBOLO v2.0 (Spider Chart)
    Padrão igual ao arquivo original
    Designer: Senior UX
    Colors: #2c6174 #427a88 #75b3a6 #1D9E75
  -->
  
  <defs>
    <filter id="glow-spider">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="grad-spider" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1D9E75;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#427a88;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#75b3a6;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- ========== SPIDER CHART DINÂMICO (Centro em cx="80" cy="80") ========== -->
  
  <!-- Teia de fundo (círculos concêntricos) -->
  <circle cx="80" cy="80" r="50" fill="none" stroke="#2c6174" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>
  <circle cx="80" cy="80" r="35" fill="none" stroke="#427a88" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>
  <circle cx="80" cy="80" r="20" fill="none" stroke="#75b3a6" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
  
  <!-- Eixos principais em 8 direções (dinâmicos) -->
  <line x1="80" y1="80" x2="80" y2="20" stroke="#1D9E75" stroke-width="2.5" opacity="0.85" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="120" y2="40" stroke="#1D9E75" stroke-width="2.2" opacity="0.75" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="140" y2="80" stroke="#427a88" stroke-width="2" opacity="0.65" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="120" y2="120" stroke="#75b3a6" stroke-width="1.8" opacity="0.55" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="80" y2="140" stroke="#75b3a6" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="40" y2="120" stroke="#427a88" stroke-width="1.4" opacity="0.35" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="20" y2="80" stroke="#2c6174" stroke-width="1.2" opacity="0.25" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="40" y2="40" stroke="#2c6174" stroke-width="1" opacity="0.15" stroke-linecap="round"/>
  
  <!-- Preenchimento do gráfico teia (suave) -->
  <polygon points="80,25 120,45 135,80 120,115 80,135 40,115 25,80 40,45" 
           fill="url(#grad-spider)" stroke="none" opacity="0.2"/>
  
  <!-- Pontos nos vértices principais (8 eixos) -->
  <circle cx="80" cy="25" r="4" fill="#1D9E75" filter="url(#glow-spider)" opacity="0.95"/>
  <circle cx="120" cy="45" r="3.5" fill="#427a88" opacity="0.85"/>
  <circle cx="135" cy="80" r="3" fill="#75b3a6" opacity="0.75"/>
  <circle cx="120" cy="115" r="2.8" fill="#75b3a6" opacity="0.65"/>
  <circle cx="80" cy="135" r="2.5" fill="#427a88" opacity="0.55"/>
  <circle cx="40" cy="115" r="2" fill="#2c6174" opacity="0.45"/>
  <circle cx="25" cy="80" r="1.5" fill="#2c6174" opacity="0.35"/>
  <circle cx="40" cy="45" r="1" fill="#427a88" opacity="0.25"/>
  
  <!-- Hub central dinamico -->
  <circle cx="80" cy="80" r="6" fill="#2c6174" opacity="0.95"/>
  <circle cx="80" cy="80" r="9" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
  <circle cx="80" cy="80" r="12" fill="none" stroke="#1D9E75" stroke-width="0.8" opacity="0.15" stroke-linecap="round"/>
  
  <!-- ========== TEXTO AO LADO (Exatamente igual ao padrão original) ========== -->
  
  <!-- Texto: RADAR -->
  <text x="160" y="85" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#2c6174">RADAR</text>
  
  <!-- Texto: BRASIL -->
  <text x="160" y="125" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#1D9E75">BRASIL</text>
</svg>