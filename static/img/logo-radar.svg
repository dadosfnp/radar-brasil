<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo subtil (opcional - remova se não quiser) -->
  <circle cx="100" cy="100" r="95" fill="#f9fafb" stroke="#2c6174" stroke-width="2" opacity="0.1"/>
  
  <!-- Círculos concêntricos (radar scanning) -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#2c6174" stroke-width="2" opacity="0.2"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#2c6174" stroke-width="2.5" opacity="0.4"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#427a88" stroke-width="2.5" opacity="0.6"/>
  <circle cx="100" cy="100" r="15" fill="none" stroke="#1D9E75" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Linhas de varredura (3 direções) -->
  <line x1="100" y1="100" x2="155" y2="55" stroke="#1D9E75" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="100" y1="100" x2="165" y2="100" stroke="#427a88" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="100" y1="100" x2="155" y2="145" stroke="#75b3a6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Ponto central (origem) -->
  <circle cx="100" cy="100" r="7" fill="#2c6174"/>
  
  <!-- Aura de movimento -->
  <circle cx="100" cy="100" r="12" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0.3"/>
</svg>