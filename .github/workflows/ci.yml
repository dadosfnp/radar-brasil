name: CI

on:
  push:
    branches: [next, main]
  pull_request:
    branches: [next]

jobs:
  test:
    name: Testes e Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 apps setup

      - name: Formatação (black)
        run: black apps setup --check

      - name: Testes
        env:
          SECRET_KEY: ci-secret-key-apenas-para-testes
          DEBUG: "True"
          ENV: development
        run: pytest apps/indicadores/tests.py -v --tb=short
